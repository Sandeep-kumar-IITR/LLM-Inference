cache:
  block_size: 16
  enable_prefix_cache: true
  max_prefix_entries: 128
  num_blocks: 256
generation:
  do_sample: false
  max_new_tokens: 128
  repetition_penalty: 1.0
  temperature: 0.0
  top_k: 0
  top_p: 1.0
logging:
  format: '%(asctime)s | %(levelname)-8s | %(name)s | %(message)s'
  level: INFO
model:
  device: auto
  max_seq_len: 2048
  name: hf-internal-testing/tiny-random-LlamaForCausalLM
  precision: auto
  trust_remote_code: true
scheduler:
  max_batch_size: 8
  policy: fcfs
  scheduling_interval: 0.01
server:
  host: 127.0.0.1
  max_concurrent_requests: 32
  max_input_tokens: 1024
  port: 8000
  request_timeout: 300
